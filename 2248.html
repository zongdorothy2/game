<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
<title>2248 Watch Game</title>
<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
    }
    html {
        overflow-y: auto;
        overflow-x: hidden;
        height: 100%;
    }
    body {
        background-color: #1e1e24;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100%;
        margin: 0;
        padding: 2px 4px 10px 4px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #1e1e24; }
    ::-webkit-scrollbar-thumb { background: #3d405b; border-radius: 10px; }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 200px;
        margin-bottom: 2px;
    }
    .title-box { display: flex; flex-direction: column; }
    .title-row { display: flex; align-items: center; gap: 4px; }
    .title {
        font-size: 16px;
        font-weight: 900;
        color: #f4d03f;
        letter-spacing: 0.5px;
    }
    .btn-help {
        background: #3d405b;
        color: #f4d03f;
        border: none;
        border-radius: 50%;
        width: 18px; height: 18px;
        font-size: 10px; font-weight: bold;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
    .coin-box {
        font-size: 10px;
        color: #f1c40f;
        font-weight: bold;
        display: flex; align-items: center; gap: 2px;
    }
    .score-container { display: flex; gap: 4px; }
    .score-box {
        background-color: #2b2d42;
        padding: 2px 4px;
        border-radius: 6px;
        text-align: center;
        min-width: 44px;
    }
    .score-label { font-size: 7px; color: #8d99ae; }
    .score-value { font-size: 11px; font-weight: bold; color: #edf2f4; }

    #preview-box {
        min-height: 12px;
        font-size: 10px;
        font-weight: 800;
        color: #2ecc71;
        text-align: center;
        margin-bottom: 2px;
    }

    .game-container {
        position: relative;
        background-color: #2b2d42;
        padding: 4px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        touch-action: none;
        overscroll-behavior: none;
    }
    .game-container.shake { animation: shake-board 0.3s ease-in-out; }
    @keyframes shake-board {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    #line-canvas {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
    }
    #game-board {
        display: grid;
        grid-template-columns: repeat(4, 42px);
        grid-template-rows: repeat(5, 42px);
        gap: 4px;
        position: relative;
        z-index: 5;
    }
    .cell {
        width: 42px; height: 42px;
        border-radius: 8px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        font-size: 16px; font-weight: 900;
        color: #ffffff;
        box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.3);
        position: relative;
    }
    .cell.small-text { font-size: 13px; }
    .cell.xsmall-text { font-size: 11px; }
    .cell.selected {
        transform: scale(0.85);
        box-shadow: 0 0 8px #ffffff;
    }

    .cell.max-value {
        border: 2px solid #ffd700;
        box-shadow: 0 0 8px #ffd700, inset 0 0 4px #ffd700;
        animation: pulse-glow 1.5s infinite alternate;
    }
    .cell.max-value::before {
        content: '👑';
        position: absolute; top: -5px; right: -3px;
        font-size: 10px;
    }
    @keyframes pulse-glow {
        0% { box-shadow: 0 0 4px #ffd700; }
        100% { box-shadow: 0 0 10px #ffe600; }
    }

    .cell.pop { animation: pop-animation 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes pop-animation {
        0% { transform: scale(0.5); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    .cell.drop { animation: drop-animation 0.25s ease-out; }
    @keyframes drop-animation {
        0% { transform: translateY(-10px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }

    .tools-bar {
        display: flex; flex-wrap: wrap; gap: 4px;
        margin-top: 4px; width: 100%; max-width: 200px;
        justify-content: center;
    }
    .tool-btn {
        flex: 1 1 30%;
        display: flex; align-items: center; justify-content: center; gap: 2px;
        background-color: #2b2d42; border: 1px solid #3d405b;
        color: #ffffff; padding: 4px 2px; border-radius: 6px;
        font-size: 9px; font-weight: bold; cursor: pointer;
    }
    .tool-btn:active { transform: scale(0.95); }
    .tool-btn.active { border-color: #e74c3c; background-color: #c0392b; }
    .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tool-cost {
        background-color: #f1c40f; color: #000;
        padding: 1px 2px; border-radius: 3px; font-size: 7px;
    }

    #combo-overlay {
        position: absolute; top: 40%; left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 18px; font-weight: 900; color: #f39c12;
        text-shadow: 0 0 10px #f1c40f, 0 0 3px #000;
        pointer-events: none; z-index: 20;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        opacity: 0; white-space: nowrap;
    }
    #combo-overlay.show {
        transform: translate(-50%, -50%) scale(1.3); opacity: 1;
    }

    #status-msg {
        margin-top: 2px; height: 12px; font-size: 9px;
        color: #f39c12; font-weight: bold; text-align: center;
    }

    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85); display: flex;
        justify-content: center; align-items: center;
        z-index: 100; opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-card {
        background: #2b2d42; border: 2px solid #3d405b;
        border-radius: 12px; padding: 10px; text-align: left;
        max-width: 200px; width: 92%;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
        max-height: 85vh; overflow-y: auto;
    }
    .modal-title { font-size: 13px; font-weight: 900; color: #f4d03f; margin-bottom: 6px; text-align: center; }
    .modal-content { font-size: 9px; color: #edf2f4; line-height: 1.4; margin-bottom: 8px; }
    .modal-content h4 { color: #2ecc71; margin: 6px 0 2px 0; font-size: 10px; }
    .modal-content ul { padding-left: 10px; margin: 2px 0; }
    .modal-btn-close {
        display: block; width: 100%; background-color: #27ae60;
        color: white; border: none; padding: 5px;
        font-size: 10px; font-weight: bold; border-radius: 6px;
        cursor: pointer; text-align: center;
    }
</style>
</head>
<body>

<div class="header">
    <div class="title-box">
        <div class="title-row">
            <div class="title">2248</div>
            <button class="btn-help" onclick="openTutorialModal()">?</button>
        </div>
        <div class="coin-box">🪙 <span id="coins">100</span></div>
    </div>
    <div class="score-container">
        <div class="score-box">
            <div class="score-label">分數</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">最高</div>
            <div class="score-value" id="best-score">0</div>
        </div>
    </div>
</div>

<div id="preview-box"></div>

<div class="game-container" id="game-container">
    <div id="combo-overlay">🔥 10連擊！</div>
    <canvas id="line-canvas"></canvas>
    <div id="game-board"></div>
</div>

<div id="status-msg"></div>

<div class="tools-bar">
    <button class="tool-btn" id="btn-undo" onclick="useUndo()">↩️復原<span class="tool-cost" id="cost-undo">50</span></button>
    <button class="tool-btn" id="btn-shuffle" onclick="useShuffle()">🔄洗牌<span class="tool-cost" id="cost-shuffle">150</span></button>
    <button class="tool-btn" id="btn-hammer" onclick="toggleHammer()">🔨鐵錘<span class="tool-cost" id="cost-hammer">100</span></button>
    <button class="tool-btn" onclick="exportSave()">💾匯出</button>
    <button class="tool-btn" onclick="triggerImport()">📂匯入</button>
</div>

<div class="modal-overlay" id="game-over-modal">
    <div class="modal-card" style="border-color: #ef233c; text-align: center;">
        <div class="modal-title" style="color: #ef233c;">GAME OVER</div>
        <div style="font-size: 10px; color: #8d99ae; margin-bottom: 4px;">無法連線且金幣不足！</div>
        <div style="font-size: 12px; color: #f4d03f; margin-bottom: 8px; font-weight: bold;" id="final-score">得分: 0</div>
        <button class="modal-btn-close" onclick="closeModal('game-over-modal'); initBoard();">重新開始</button>
    </div>
</div>

<div class="modal-overlay" id="tutorial-modal">
    <div class="modal-card">
        <div class="modal-title">📖 玩法說明</div>
        <div class="modal-content">
            <h4>🎮 連線規則</h4>
            <ul>
                <li>滑動連接 8 方向相鄰數字。</li>
                <li>前兩個需完全相同，後續可接相同或兩倍數字。</li>
            </ul>
            <h4>⚡ 進位淘汰</h4>
            <ul>
                <li>合成 2048 時自動消除 8 及以下方塊！</li>
            </ul>
        </div>
        <button class="modal-btn-close" onclick="closeModal('tutorial-modal')">開始遊戲</button>
    </div>
</div>

<input type="file" id="file-input" accept=".json" style="display: none;" onchange="importSave(event)">

<script>
    const ROWS = 5;
    const COLS = 4;
    const boardElement = document.getElementById('game-board');
    const containerElement = document.getElementById('game-container');
    const canvas = document.getElementById('line-canvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const bestScoreElement = document.getElementById('best-score');
    const coinsElement = document.getElementById('coins');
    const statusMsg = document.getElementById('status-msg');
    const previewBox = document.getElementById('preview-box');
    const comboOverlay = document.getElementById('combo-overlay');
    const gameOverModal = document.getElementById('game-over-modal');
    const tutorialModal = document.getElementById('tutorial-modal');

    let board = [];
    let score = 0;
    let coins = 100;
    let bestScore = localStorage.getItem('2248_watch_4x5_best') || 0;
    let isDragging = false;
    let selectedCells = [];
    let isHammerMode = false;
    let minAllowedValue = 2;
    let mergedTargetPos = null;
    let lastState = null;

    bestScoreElement.textContent = bestScore;
    coinsElement.textContent = coins;

    function getToolCost(type) {
        const maxValue = getBoardMaxValue();
        let baseCost = (type === 'undo') ? 50 : (type === 'hammer') ? 100 : 150;
        if (maxValue >= 2048) {
            const powerOffset = Math.log2(maxValue / 1024);
            return Math.floor(baseCost * (1 + powerOffset * 0.15));
        }
        return baseCost;
    }

    function getCellColor(val) {
        if (!val || val <= 0) return '#2b2d42';
        const power = Math.round(Math.log2(val));
        const hue = (power * 37) % 360;
        return `linear-gradient(135deg, hsl(${hue}, 85%, 52%), hsl(${hue}, 85%, 40%))`;
    }

    function formatNumber(val) {
        if (val < 16384) return val.toString();
        const units = ['', 'K', 'M', 'G', 'Q', 'Z'];
        let powerIndex = Math.min(Math.floor(Math.log2(val) / 10), units.length - 1);
        return Math.floor(val / Math.pow(1024, powerIndex)) + units[powerIndex];
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playConnectSound(index) {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(300 * Math.pow(1.12, index), audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }
    function playMergeSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function triggerShake() {
        containerElement.classList.remove('shake');
        void containerElement.offsetWidth;
        containerElement.classList.add('shake');
    }

    function openTutorialModal() { tutorialModal.classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function initBoard() {
        score = 0;
        minAllowedValue = 2;
        lastState = null;
        scoreElement.textContent = score;
        board = [];
        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) { row.push(generateRandomBlock()); }
            board.push(row);
        }
        renderBoard(true);
        resizeCanvas();
        updateToolsState();
    }

    function generateRandomBlock() {
        let options = [];
        let base = minAllowedValue;
        for (let i = 0; i < 6; i++) { options.push(base * Math.pow(2, i)); }
        const weights = [35, 25, 18, 12, 7, 3];
        const randomNum = Math.floor(Math.random() * 100);
        let sum = 0;
        for (let i = 0; i < weights.length; i++) {
            sum += weights[i];
            if (randomNum < sum) return options[i];
        }
        return options[0];
    }

    function resizeCanvas() {
        const rect = boardElement.getBoundingClientRect();
        canvas.width = rect.width + 10;
        canvas.height = rect.height + 10;
    }

    function getBoardMaxValue() {
        let max = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] > max) max = board[r][c];
            }
        }
        return max;
    }

    function renderBoard(isNewDrop = false) {
        boardElement.innerHTML = '';
        const maxValue = getBoardMaxValue();

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const val = board[r][c];
                const text = formatNumber(val);
                cell.textContent = text;
                cell.style.background = getCellColor(val);
                cell.dataset.r = r;
                cell.dataset.c = c;

                if (text.length >= 4) cell.classList.add('small-text');
                if (val === maxValue && val >= 16) cell.classList.add('max-value');

                if (mergedTargetPos && mergedTargetPos.r === r && mergedTargetPos.c === c) {
                    cell.classList.add('pop');
                } else if (isNewDrop) {
                    cell.classList.add('drop');
                }
                boardElement.appendChild(cell);
            }
        }
        mergedTargetPos = null;
        updateToolsState();
    }

    function saveCurrentState() {
        lastState = {
            board: JSON.parse(JSON.stringify(board)),
            score: score, coins: coins, minAllowedValue: minAllowedValue
        };
        updateToolsState();
    }

    function getCellPos(cell) {
        const rect = cell.getBoundingClientRect();
        const parentRect = canvas.getBoundingClientRect();
        return { x: rect.left + rect.width / 2 - parentRect.left, y: rect.top + rect.height / 2 - parentRect.top };
    }

    function drawLines(currentX, currentY) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (selectedCells.length === 0) return;
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const firstPos = getCellPos(selectedCells[0].element);
        ctx.moveTo(firstPos.x, firstPos.y);
        for (let i = 1; i < selectedCells.length; i++) {
            const pos = getCellPos(selectedCells[i].element);
            ctx.lineTo(pos.x, pos.y);
        }
        if (currentX !== undefined && currentY !== undefined) {
            const parentRect = canvas.getBoundingClientRect();
            ctx.lineTo(currentX - parentRect.left, currentY - parentRect.top);
        }
        ctx.stroke();
    }

    function getTargetCell(x, y) {
        const target = document.elementFromPoint(x, y);
        return (target && target.classList.contains('cell')) ? target : null;
    }

    function handleStart(x, y) {
        const cell = getTargetCell(x, y);
        if (!cell) return;
        if (isHammerMode) { useHammer(cell); return; }
        isDragging = true;
        selectedCells = [];
        addToSelection(cell);
        drawLines(x, y);
    }

    function handleMove(x, y) {
        if (!isDragging || isHammerMode) return;
        const cell = getTargetCell(x, y);
        if (cell) addToSelection(cell);
        drawLines(x, y);
        updatePreview();
    }

    function handleEnd() {
        if (!isDragging || isHammerMode) return;
        isDragging = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        previewBox.textContent = '';

        if (selectedCells.length >= 2) {
            if (selectedCells.length >= 10) {
                comboOverlay.textContent = `🔥 ${selectedCells.length}連擊！`;
                comboOverlay.classList.add('show');
                setTimeout(() => comboOverlay.classList.remove('show'), 1000);
            }
            mergeCells();
        } else {
            selectedCells.forEach(c => c.element.classList.remove('selected'));
            selectedCells = [];
        }
    }

    function updatePreview() {
        if (selectedCells.length < 2) { previewBox.textContent = ''; return; }
        const last = selectedCells[selectedCells.length - 1];
        let sum = selectedCells.reduce((acc, cur) => acc + cur.val, 0);
        let mergedValue = Math.max(Math.pow(2, Math.floor(Math.log2(sum))), last.val * 2);
        previewBox.textContent = `🎯 ${formatNumber(mergedValue)} (+${sum})`;
    }

    function addToSelection(cell) {
        const r = parseInt(cell.dataset.r);
        const c = parseInt(cell.dataset.c);
        const val = board[r][c];

        if (selectedCells.some(s => s.r === r && s.c === c)) {
            if (selectedCells.length >= 2) {
                const prev = selectedCells[selectedCells.length - 2];
                if (prev.r === r && prev.c === c) {
                    selectedCells.pop().element.classList.remove('selected');
                }
            }
            return;
        }

        if (selectedCells.length === 0) {
            selectedCells.push({ r, c, val, element: cell });
            cell.classList.add('selected');
            playConnectSound(selectedCells.length);
            return;
        }

        const lastCell = selectedCells[selectedCells.length - 1];
        if (Math.abs(lastCell.r - r) <= 1 && Math.abs(lastCell.c - c) <= 1) {
            if (selectedCells.length === 1 && val === lastCell.val) {
                selectedCells.push({ r, c, val, element: cell });
                cell.classList.add('selected');
                playConnectSound(selectedCells.length);
            } else if (selectedCells.length > 1 && (val === lastCell.val || val === lastCell.val * 2)) {
                selectedCells.push({ r, c, val, element: cell });
                cell.classList.add('selected');
                playConnectSound(selectedCells.length);
            }
        }
    }

    function mergeCells() {
        saveCurrentState();
        const last = selectedCells[selectedCells.length - 1];
        let sum = selectedCells.reduce((acc, cur) => acc + cur.val, 0);
        let mergedValue = Math.max(Math.pow(2, Math.floor(Math.log2(sum))), last.val * 2);

        selectedCells.forEach(c => board[c.r][c.c] = 0);
        board[last.r][last.c] = mergedValue;
        mergedTargetPos = { r: last.r, c: last.c };
        playMergeSound();

        score += sum;
        coins += Math.floor(sum / 5);
        scoreElement.textContent = score;
        coinsElement.textContent = coins;

        if (score > bestScore) {
            bestScore = score;
            bestScoreElement.textContent = bestScore;
            localStorage.setItem('2248_watch_4x5_best', bestScore);
        }

        checkAndEliminateLowerBlocks(mergedValue);
        applyGravity();
        selectedCells = [];
        checkGameOver();
    }

    function checkAndEliminateLowerBlocks(newVal) {
        if (newVal >= 2048) {
            let threshold = newVal / 256;
            if (threshold >= minAllowedValue) {
                minAllowedValue = threshold * 2;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c] > 0 && board[r][c] <= threshold) board[r][c] = 0;
                    }
                }
                triggerShake();
            }
        }
    }

    function applyGravity() {
        for (let c = 0; c < COLS; c++) {
            let colVals = [];
            for (let r = 0; r < ROWS; r++) { if (board[r][c] !== 0) colVals.push(board[r][c]); }
            while (colVals.length < ROWS) colVals.unshift(generateRandomBlock());
            for (let r = 0; r < ROWS; r++) board[r][c] = colVals[r];
        }
        renderBoard(true);
    }

    function checkGameOver() {
        const hammerCost = getToolCost('hammer');
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let v = board[r][c];
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            let nv = board[nr][nc];
                            if (nv === v || nv === v * 2) return;
                        }
                    }
                }
            }
        }
        if (coins >= hammerCost) return;
        document.getElementById('final-score').textContent = `得分: ${score}`;
        gameOverModal.classList.add('show');
    }

    function updateToolsState() {
        const undoCost = getToolCost('undo');
        const shuffleCost = getToolCost('shuffle');
        const hammerCost = getToolCost('hammer');

        document.getElementById('cost-undo').textContent = undoCost;
        document.getElementById('cost-shuffle').textContent = shuffleCost;
        document.getElementById('cost-hammer').textContent = hammerCost;

        document.getElementById('btn-undo').disabled = !lastState || coins < undoCost;
        document.getElementById('btn-shuffle').disabled = coins < shuffleCost;
        document.getElementById('btn-hammer').disabled = coins < hammerCost;
    }

    function useUndo() {
        const cost = getToolCost('undo');
        if (!lastState || coins < cost) return;
        coins -= cost;
        board = JSON.parse(JSON.stringify(lastState.board));
        score = lastState.score;
        minAllowedValue = lastState.minAllowedValue;
        scoreElement.textContent = score;
        coinsElement.textContent = coins;
        lastState = null;
        renderBoard(true);
    }

    function useShuffle() {
        const cost = getToolCost('shuffle');
        if (coins < cost) return;
        saveCurrentState();
        coins -= cost;
        coinsElement.textContent = coins;
        triggerShake();
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                board[r][c] = generateRandomBlock();
            }
        }
        renderBoard(true);
    }

    function toggleHammer() {
        if (coins < getToolCost('hammer')) return;
        isHammerMode = !isHammerMode;
        document.getElementById('btn-hammer').classList.toggle('active', isHammerMode);
    }

    function useHammer(cell) {
        saveCurrentState();
        coins -= getToolCost('hammer');
        coinsElement.textContent = coins;
        board[parseInt(cell.dataset.r)][parseInt(cell.dataset.c)] = 0;
        isHammerMode = false;
        document.getElementById('btn-hammer').classList.remove('active');
        applyGravity();
        checkGameOver();
    }

    function exportSave() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ score, coins, bestScore, board }));
        const a = document.createElement('a');
        a.href = dataStr; a.download = "2248_watch_4x5_save.json";
        a.click();
    }

    function triggerImport() { document.getElementById('file-input').click(); }

    function importSave(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = JSON.parse(evt.target.result);
                score = data.score; coins = data.coins; bestScore = data.bestScore; board = data.board;
                scoreElement.textContent = score; coinsElement.textContent = coins; bestScoreElement.textContent = bestScore;
                renderBoard(true);
            } catch (err) { alert('格式錯誤'); }
        };
        reader.readAsText(file);
    }

    window.addEventListener('touchstart', e => handleStart(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
    window.addEventListener('touchmove', e => handleMove(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
    window.addEventListener('touchend', handleEnd);
    window.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('resize', resizeCanvas);

    initBoard();
</script>
</body>
</html>
