<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2248 Watch Big</title>
<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        margin: 0;
        padding: 0;
    }
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #121214;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 2px 4px 4px 4px; /* 極窄邊距 */
    }

    /* 頂部單行超緊湊儀表板 (高度僅約 20px) */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 220px;
        padding: 0 2px;
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .title {
        font-size: 14px;
        font-weight: 900;
        color: #f1c40f;
        letter-spacing: -0.5px;
    }
    .coin-tag {
        font-size: 11px;
        color: #f39c12;
        font-weight: 800;
    }
    .header-right {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        color: #8d99ae;
    }
    .header-right span {
        color: #ffffff;
        font-weight: 900;
    }

    /* 浮動提示文字 (不占垂直高度) */
    #preview-box {
        height: 14px;
        line-height: 14px;
        font-size: 11px;
        font-weight: 900;
        color: #2ecc71;
        text-align: center;
    }

    /* 放大版棋盤 (4*42px + 3*4px + 6px邊界 = 186px) */
    .board-wrap {
        position: relative;
        background: #1e1e24;
        padding: 3px;
        border-radius: 10px;
    }
    #line-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
    }
    #game-board {
        display: grid;
        grid-template-columns: repeat(4, 42px);
        grid-template-rows: repeat(4, 42px);
        gap: 4px;
        position: relative;
        z-index: 5;
    }

    /* 方格與超大清晰數字 */
    .cell {
        width: 42px;
        height: 42px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;          /* 基礎字體直接拉到 20px 大字 */
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .cell.selected {
        outline: 2px solid #ffffff;
        transform: scale(0.92);
    }
    .cell.num-3 { font-size: 15px; } /* 3位數微調 (128, 256, 512) */
    .cell.num-4 { font-size: 12px; } /* 4位數微調 (1024, 2048) */
    .cell.num-5 { font-size: 10px; } /* 5位數以上 */

    /* 底部單行功能鍵 (高度約 26px) */
    .tools-bar {
        display: flex;
        gap: 3px;
        width: 100%;
        max-width: 210px;
        justify-content: space-between;
    }
    .btn {
        flex: 1;
        background: #2b2d38;
        border: 1px solid #3e4152;
        color: #fff;
        border-radius: 5px;
        height: 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: bold;
        cursor: pointer;
    }
    .btn:active { background: #3e4152; }
    .btn.active { background: #c0392b; border-color: #e74c3c; }
    .btn:disabled { opacity: 0.3; }
    .btn .cost {
        font-size: 7px;
        color: #f1c40f;
        line-height: 1;
        transform: scale(0.85);
    }

    /* 彈窗樣式 */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
        background: #23242b;
        border-radius: 8px;
        padding: 10px;
        width: 85%;
        max-width: 180px;
        text-align: center;
    }
    .modal-card h3 { font-size: 13px; margin-bottom: 6px; color: #f1c40f; }
    .modal-card p { font-size: 10px; line-height: 1.4; color: #ccc; margin-bottom: 8px; }
    .modal-btn {
        background: #27ae60;
        border: none;
        color: #fff;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 10px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="app">
    <!-- 單行頂部列 -->
    <div class="header">
        <div class="header-left">
            <span class="title">2248</span>
            <div class="coin-tag">🪙<span id="coins">100</span></div>
        </div>
        <div class="header-right">
            <div>分:<span id="score">0</span></div>
            <div>冠:<span id="best-score">0</span></div>
        </div>
    </div>

    <!-- 即時預覽列 -->
    <div id="preview-box"></div>

    <!-- 放大棋盤 -->
    <div class="board-wrap" id="board-wrap">
        <canvas id="line-canvas"></canvas>
        <div id="game-board"></div>
    </div>

    <!-- 底部按鈕 -->
    <div class="tools-bar">
        <button class="btn" id="btn-undo" onclick="useUndo()">↩️復原<span class="cost" id="cost-undo">50</span></button>
        <button class="btn" id="btn-shuffle" onclick="useShuffle()">🔄洗牌<span class="cost" id="cost-shuffle">150</span></button>
        <button class="btn" id="btn-hammer" onclick="toggleHammer()">🔨鐵錘<span class="cost" id="cost-hammer">100</span></button>
        <button class="btn" onclick="exportSave()">💾存檔</button>
        <button class="btn" onclick="document.getElementById('file-input').click()">📂讀檔</button>
    </div>
</div>

<!-- 遊戲結束彈窗 -->
<div class="modal-overlay" id="game-over-modal">
    <div class="modal-card">
        <h3 style="color:#e74c3c;">遊戲結束</h3>
        <p id="final-score">得分: 0</p>
        <button class="modal-btn" onclick="closeModal('game-over-modal'); initBoard();">再玩一次</button>
    </div>
</div>

<input type="file" id="file-input" accept=".json" style="display: none;" onchange="importSave(event)">

<script>
    const ROWS = 4;
    const COLS = 4;
    const boardElement = document.getElementById('game-board');
    const boardWrap = document.getElementById('board-wrap');
    const canvas = document.getElementById('line-canvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const bestScoreElement = document.getElementById('best-score');
    const coinsElement = document.getElementById('coins');
    const previewBox = document.getElementById('preview-box');

    let board = [];
    let score = 0;
    let coins = 100;
    let bestScore = parseInt(localStorage.getItem('2248_watch_big_best') || '0', 10);
    let isDragging = false;
    let selectedCells = [];
    let isHammerMode = false;
    let minAllowedValue = 2;
    let lastState = null;
    let cellRects = [];

    bestScoreElement.textContent = bestScore;
    coinsElement.textContent = coins;

    // 高對比靜態色票
    const COLOR_MAP = {
        2: '#27ae60', 4: '#16a085', 8: '#2980b9', 16: '#8e44ad',
        32: '#d35400', 64: '#c0392b', 128: '#f39c12', 256: '#1abc9c',
        512: '#3498db', 1024: '#9b59b6', 2048: '#e67e22', 4096: '#e74c3c'
    };

    function getCellColor(val) {
        return COLOR_MAP[val] || '#34495e';
    }

    function formatNumber(val) {
        if (val < 10000) return val.toString();
        if (val < 1000000) return Math.floor(val / 1000) + 'K';
        return Math.floor(val / 1000000) + 'M';
    }

    function initBoard() {
        score = 0;
        minAllowedValue = 2;
        lastState = null;
        scoreElement.textContent = score;
        board = [];
        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) row.push(generateRandomBlock());
            board.push(row);
        }
        renderBoard();
        updateBoardRects();
        updateToolsState();
    }

    function generateRandomBlock() {
        const base = minAllowedValue;
        const weights = [40, 28, 18, 10, 4];
        let rand = Math.random() * 100;
        let sum = 0;
        for (let i = 0; i < weights.length; i++) {
            sum += weights[i];
            if (rand < sum) return base * Math.pow(2, i);
        }
        return base;
    }

    function updateBoardRects() {
        const wrapRect = boardWrap.getBoundingClientRect();
        canvas.width = wrapRect.width;
        canvas.height = wrapRect.height;

        cellRects = [];
        const cells = boardElement.children;
        for (let i = 0; i < cells.length; i++) {
            const rect = cells[i].getBoundingClientRect();
            cellRects.push({
                r: parseInt(cells[i].dataset.r, 10),
                c: parseInt(cells[i].dataset.c, 10),
                left: rect.left,
                right: rect.right,
                top: rect.top,
                bottom: rect.bottom,
                centerX: rect.left + rect.width / 2 - wrapRect.left,
                centerY: rect.top + rect.height / 2 - wrapRect.top,
                element: cells[i]
            });
        }
    }

    function renderBoard() {
        boardElement.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                const val = board[r][c];
                const text = formatNumber(val);
                cell.className = 'cell';
                cell.textContent = text;
                cell.style.backgroundColor = getCellColor(val);
                cell.dataset.r = r;
                cell.dataset.c = c;

                // 依數字位元自動配置最大字體
                if (text.length >= 5) cell.classList.add('num-5');
                else if (text.length === 4) cell.classList.add('num-4');
                else if (text.length === 3) cell.classList.add('num-3');

                boardElement.appendChild(cell);
            }
        }
        updateToolsState();
    }

    function findCellByPos(x, y) {
        for (let i = 0; i < cellRects.length; i++) {
            const b = cellRects[i];
            if (x >= b.left && x <= b.right && y >= b.top && y <= b.bottom) {
                return b;
            }
        }
        return null;
    }

    function handleStart(x, y) {
        const item = findCellByPos(x, y);
        if (!item) return;

        if (isHammerMode) {
            useHammer(item);
            return;
        }

        isDragging = true;
        selectedCells = [item];
        item.element.classList.add('selected');
        drawLines(x, y);
    }

    function handleMove(x, y) {
        if (!isDragging || isHammerMode) return;
        const item = findCellByPos(x, y);

        if (item) {
            const last = selectedCells[selectedCells.length - 1];
            if (selectedCells.length >= 2 && selectedCells[selectedCells.length - 2] === item) {
                const popped = selectedCells.pop();
                popped.element.classList.remove('selected');
            } else if (!selectedCells.includes(item)) {
                if (Math.abs(last.r - item.r) <= 1 && Math.abs(last.c - item.c) <= 1) {
                    const currentVal = board[item.r][item.c];
                    const lastVal = board[last.r][last.c];
                    if ((selectedCells.length === 1 && currentVal === lastVal) ||
                        (selectedCells.length > 1 && (currentVal === lastVal || currentVal === lastVal * 2))) {
                        selectedCells.push(item);
                        item.element.classList.add('selected');
                    }
                }
            }
        }

        drawLines(x, y);
        updatePreview();
    }

    function handleEnd() {
        if (!isDragging || isHammerMode) return;
        isDragging = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        previewBox.textContent = '';

        if (selectedCells.length >= 2) {
            mergeCells();
        } else {
            selectedCells.forEach(i => i.element.classList.remove('selected'));
            selectedCells = [];
        }
    }

    function drawLines(touchX, touchY) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (selectedCells.length === 0) return;

        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.moveTo(selectedCells[0].centerX, selectedCells[0].centerY);
        for (let i = 1; i < selectedCells.length; i++) {
            ctx.lineTo(selectedCells[i].centerX, selectedCells[i].centerY);
        }
        if (touchX !== undefined && touchY !== undefined) {
            const wrapRect = boardWrap.getBoundingClientRect();
            ctx.lineTo(touchX - wrapRect.left, touchY - wrapRect.top);
        }
        ctx.stroke();
    }

    function updatePreview() {
        if (selectedCells.length < 2) {
            previewBox.textContent = '';
            return;
        }
        const lastVal = board[selectedCells[selectedCells.length - 1].r][selectedCells[selectedCells.length - 1].c];
        let sum = selectedCells.reduce((acc, cur) => acc + board[cur.r][cur.c], 0);
        let mergedValue = Math.max(Math.pow(2, Math.floor(Math.log2(sum))), lastVal * 2);
        previewBox.textContent = `🎯 ${formatNumber(mergedValue)} (+${sum})`;
    }

    function mergeCells() {
        saveCurrentState();
        const last = selectedCells[selectedCells.length - 1];
        let sum = selectedCells.reduce((acc, cur) => acc + board[cur.r][cur.c], 0);
        let mergedValue = Math.max(Math.pow(2, Math.floor(Math.log2(sum))), board[last.r][last.c] * 2);

        selectedCells.forEach(item => board[item.r][item.c] = 0);
        board[last.r][last.c] = mergedValue;

        score += sum;
        coins += Math.max(1, Math.floor(sum / 10));
        scoreElement.textContent = score;
        coinsElement.textContent = coins;

        if (score > bestScore) {
            bestScore = score;
            bestScoreElement.textContent = bestScore;
            localStorage.setItem('2248_watch_big_best', bestScore);
        }

        applyGravity();
        selectedCells = [];
        checkGameOver();
    }

    function applyGravity() {
        for (let c = 0; c < COLS; c++) {
            let col = [];
            for (let r = 0; r < ROWS; r++) {
                if (board[r][c] !== 0) col.push(board[r][c]);
            }
            while (col.length < ROWS) col.unshift(generateRandomBlock());
            for (let r = 0; r < ROWS; r++) board[r][c] = col[r];
        }
        renderBoard();
        updateBoardRects();
    }

    function checkGameOver() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let v = board[r][c];
                const neighbors = [[r+1, c], [r-1, c], [r, c+1], [r, c-1], [r+1, c+1], [r-1, c-1], [r+1, c-1], [r-1, c+1]];
                for (let [nr, nc] of neighbors) {
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (board[nr][nc] === v || board[nr][nc] === v * 2) return;
                    }
                }
            }
        }
        if (coins >= 100) return;
        document.getElementById('final-score').textContent = `得分: ${score}`;
        document.getElementById('game-over-modal').classList.add('show');
    }

    function saveCurrentState() {
        lastState = { board: JSON.parse(JSON.stringify(board)), score, coins };
        updateToolsState();
    }

    function updateToolsState() {
        document.getElementById('btn-undo').disabled = !lastState || coins < 50;
        document.getElementById('btn-shuffle').disabled = coins < 150;
        document.getElementById('btn-hammer').disabled = coins < 100;
    }

    function useUndo() {
        if (!lastState || coins < 50) return;
        coins -= 50;
        board = lastState.board;
        score = lastState.score;
        scoreElement.textContent = score;
        coinsElement.textContent = coins;
        lastState = null;
        renderBoard();
        updateBoardRects();
    }

    function useShuffle() {
        if (coins < 150) return;
        saveCurrentState();
        coins -= 150;
        coinsElement.textContent = coins;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) board[r][c] = generateRandomBlock();
        }
        renderBoard();
        updateBoardRects();
    }

    function toggleHammer() {
        if (coins < 100) return;
        isHammerMode = !isHammerMode;
        document.getElementById('btn-hammer').classList.toggle('active', isHammerMode);
    }

    function useHammer(item) {
        saveCurrentState();
        coins -= 100;
        coinsElement.textContent = coins;
        board[item.r][item.c] = 0;
        isHammerMode = false;
        document.getElementById('btn-hammer').classList.remove('active');
        applyGravity();
        checkGameOver();
    }

    function exportSave() {
        const blob = new Blob([JSON.stringify({ score, coins, bestScore, board })], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '2248_save.json';
        a.click();
    }

    function importSave(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
            try {
                const data = JSON.parse(evt.target.result);
                score = data.score; coins = data.coins; bestScore = data.bestScore; board = data.board;
                scoreElement.textContent = score; coinsElement.textContent = coins; bestScoreElement.textContent = bestScore;
                renderBoard();
                updateBoardRects();
            } catch (err) { alert('無效檔案'); }
        };
        reader.readAsText(file);
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }

    window.addEventListener('touchstart', e => handleStart(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
    window.addEventListener('touchmove', e => handleMove(e.touches[0].clientX, e.touches[0].clientY), { passive: false });
    window.addEventListener('touchend', handleEnd);
    window.addEventListener('resize', updateBoardRects);

    initBoard();
</script>
</body>
</html>
